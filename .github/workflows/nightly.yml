# Motadata console ka AI QA — har raat poori pipeline, aur haath se koi bhi suite (docs/testing.md).
#
# Settings → Secrets and variables → Actions:
#   Variables : APP_URL, APP_ADMIN_EMAIL, MAILOSAUR_SERVER_ID (teeno zaroori), APP_NAME, AZURE_OPENAI_DEPLOYMENT
#   Secrets   : model key (AZURE_API_KEY + AZURE_RESOURCE_NAME, ya ANTHROPIC_API_KEY / OPENAI_API_KEY / AI_GATEWAY_API_KEY)
#               MAILOSAUR_API_KEY                             (console admin ka sign-in code — iske bina admin setup fail, run red)
#               BASIC_AUTH_USERNAME / BASIC_AUTH_PASSWORD     (staging basic auth ho to, optional)
#               SLACK_WEBHOOK_URL / TEAMS_WEBHOOK_URL         (notification, optional)

name: nightly-qa
run-name: ${{ inputs.suite || 'nightly' }} ${{ inputs.module }}

on:
  schedule:
    - cron: '17 20 * * *' # roz 20:17 UTC = 1:47 AM IST
  workflow_dispatch:
    inputs:
      suite:
        description: 'Kya chalana hai (nightly = poori pipeline)'
        type: choice
        # lib/suites.ts ke RUNNABLE, `retest` ke bina: use pichhle run ka report.json
        # usi machine pe chahiye (naye runner pe nahi hota) — CI me failed job dobara chalao.
        options: [nightly, smoke, sanity, regression, bugs, explore, monkey]
        default: nightly
      module:
        description: 'Module, jaise iam (khaali = sab). nightly hamesha sab modules chalata hai.'
        required: false
      app_url:
        description: 'Kisi aur URL pe chalana ho (khaali = vars.APP_URL)'
        required: false

permissions:
  contents: read

# Ek shared tenant aur ek hi admin login: CI ke runs ek ke baad ek (tenant pe load kam; do sign-in codes na takraayein).
concurrency:
  group: nightly-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    # Nightly ki stages ki apni time limits hain (nightly.config.ts: smoke 10 + regression 45 + 6 charters × 8 = 103 min);
    # job ka timeout unke jod + install se upar — CI job ko maare to report nahi banti.
    timeout-minutes: 130
    env:
      E2E_TELEMETRY_DISABLED: '1'
      APP_URL: ${{ inputs.app_url || vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      MAILOSAUR_SERVER_ID: ${{ vars.MAILOSAUR_SERVER_ID }} # test addresses isi inbox ke: `npm test` ko bhi chahiye
      SUITE: ${{ inputs.suite || 'nightly' }} # schedule pe inputs nahi hote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck + verify (tags, brief coverage, charters): app nahi khulta, model call nahi, koi secret nahi
      # (sirf APP_URL aur MAILOSAUR_SERVER_ID variables, jo tests collect hote waqt padhe jaate hain).
      # Galat tag ya charter yahin pakdo, raat ke run ke beech me nahi.
      - run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        run: npx e2e-web install chromium --with-deps

      # Pichhli raaton ka history.json → report me trend
      - name: Restore history
        if: ${{ env.SUITE == 'nightly' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nightly-history
          key: nightly-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nightly-history-

      # MODULE env se aata hai (input seedha script me nahi), aur bina quotes ke: khaali = sab modules, "iam tickets" = do.
      - name: Run ${{ env.SUITE }}
        run: |
          if [ "$SUITE" = nightly ]; then
            node scripts/nightly.ts
          else
            node scripts/suite.ts "$SUITE" $MODULE
          fi
        env:
          MODULE: ${{ inputs.module }}
          # --- Model (jo use karte ho bas wahi) ---
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_RESOURCE_NAME: ${{ secrets.AZURE_RESOURCE_NAME }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # --- Console admin login (sign-in code Mailosaur se) / staging protection ---
          APP_ADMIN_EMAIL: ${{ vars.APP_ADMIN_EMAIL }}
          APP_ADMIN_NAME: ${{ vars.APP_ADMIN_NAME }}
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          # --- Optional (README → IAM): na hon to sirf woh tests skip ---
          IAM_SCIM_USER_EMAIL: ${{ vars.IAM_SCIM_USER_EMAIL }}
          IAM_TEAM: ${{ vars.IAM_TEAM }}
          IAM_TEAM_MEMBER_EMAIL: ${{ vars.IAM_TEAM_MEMBER_EMAIL }}
          BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          # --- Notification (nightly; optional) ---
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          NOTIFY_ON: always # ya: problems

      # always(): run red ho to bhi report upload ho
      - name: Save history
        if: ${{ always() && env.SUITE == 'nightly' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nightly-history
          key: nightly-history-${{ github.run_id }}-${{ github.run_attempt }}

      # Download karke index.html kholo (raw/ folder saath me rehna chahiye)
      - name: Upload report
        if: ${{ always() && env.SUITE == 'nightly' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report-${{ github.run_number }}
          path: nightly-report
          if-no-files-found: warn
          retention-days: 30

      # Baaki suites: e2e ka apna output (report.json, junit.xml, report.html, results/ me traces + screenshots).
      # sessions/ (saved logins) kabhi upload nahi; cache/ repo me commit hai.
      - name: Upload e2e output
        if: ${{ !cancelled() && env.SUITE != 'nightly' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ env.SUITE }}-${{ github.run_number }}
          path: |
            .e2e
            !.e2e/**/sessions/**
            !.e2e/cache/**
          include-hidden-files: true # .e2e dot-folder hai
          if-no-files-found: warn
          retention-days: 7

# AI QA for the Motadata console — the whole pipeline every night, and any suite by hand (docs/testing.md).
#
# Settings → Secrets and variables → Actions:
#   Variables : APP_URL, APP_ADMIN_EMAIL, MAILOSAUR_SERVER_ID (all three required), APP_NAME, AZURE_OPENAI_DEPLOYMENT
#   Secrets   : model key (AZURE_API_KEY + AZURE_RESOURCE_NAME, or ANTHROPIC_API_KEY / OPENAI_API_KEY / AI_GATEWAY_API_KEY)
#               MAILOSAUR_API_KEY                             (the console admin's sign-in code — without it the admin setup fails, run red)
#               BASIC_AUTH_USERNAME / BASIC_AUTH_PASSWORD     (for staging basic auth, optional)
#               SLACK_WEBHOOK_URL / TEAMS_WEBHOOK_URL         (notification, optional)

name: nightly-qa
run-name: ${{ inputs.suite || 'nightly' }} ${{ inputs.module }}

on:
  schedule:
    - cron: '17 20 * * *' # daily 20:17 UTC = 1:47 AM IST
  workflow_dispatch:
    inputs:
      suite:
        description: 'What to run (nightly = the whole pipeline)'
        type: choice
        # RUNNABLE from lib/suites.ts, without `retest`: it needs the previous run's report.json
        # on the same machine (a new runner has none) — in CI, re-run the failed job.
        options: [nightly, smoke, sanity, regression, bugs, explore, monkey]
        default: nightly
      module:
        description: 'Module, such as iam (empty = all). nightly always runs all modules.'
        required: false
      app_url:
        description: 'To run against another URL (empty = vars.APP_URL)'
        required: false

permissions:
  contents: read

# One shared tenant and a single admin login: CI runs go one after another (less load on the tenant; two sign-in codes do not collide).
concurrency:
  group: nightly-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    # The nightly's stages have their own time limits (nightly.config.ts: smoke 10 + regression 45 + 6 charters × 8 = 103 min);
    # the job timeout is above their sum + install — if CI kills the job, no report is written.
    timeout-minutes: 130
    env:
      E2E_TELEMETRY_DISABLED: '1'
      APP_URL: ${{ inputs.app_url || vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      MAILOSAUR_SERVER_ID: ${{ vars.MAILOSAUR_SERVER_ID }} # test addresses are in this inbox: `npm test` needs it too
      SUITE: ${{ inputs.suite || 'nightly' }} # a scheduled run has no inputs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck + verify (tags, brief coverage, charters): the app is not opened, no model call, no secret
      # (only the APP_URL and MAILOSAUR_SERVER_ID variables, which are read while tests are collected).
      # Catch a wrong tag or charter here, not in the middle of the night's run.
      - run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        run: npx e2e-web install chromium --with-deps

      # history.json of the previous nights → the trend in the report
      - name: Restore history
        if: ${{ env.SUITE == 'nightly' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nightly-history
          key: nightly-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nightly-history-

      # MODULE comes from env (the input is not put straight into the script), and unquoted: empty = all modules, "iam tickets" = two.
      - name: Run ${{ env.SUITE }}
        run: |
          if [ "$SUITE" = nightly ]; then
            node scripts/nightly.ts
          else
            node scripts/suite.ts "$SUITE" $MODULE
          fi
        env:
          MODULE: ${{ inputs.module }}
          # --- Model (only the one you use) ---
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_RESOURCE_NAME: ${{ secrets.AZURE_RESOURCE_NAME }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # --- Console admin login (sign-in code from Mailosaur) / staging protection ---
          APP_ADMIN_EMAIL: ${{ vars.APP_ADMIN_EMAIL }}
          APP_ADMIN_NAME: ${{ vars.APP_ADMIN_NAME }}
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          # --- Optional (README → IAM): when not set only those tests are skipped ---
          IAM_SCIM_USER_EMAIL: ${{ vars.IAM_SCIM_USER_EMAIL }}
          IAM_TEAM: ${{ vars.IAM_TEAM }}
          IAM_TEAM_MEMBER_EMAIL: ${{ vars.IAM_TEAM_MEMBER_EMAIL }}
          BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          # --- Notification (nightly; optional) ---
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          NOTIFY_ON: always # or: problems

      # always(): upload the report even when the run is red
      - name: Save history
        if: ${{ always() && env.SUITE == 'nightly' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nightly-history
          key: nightly-history-${{ github.run_id }}-${{ github.run_attempt }}

      # Download it and open index.html (the raw/ folder must stay next to it)
      - name: Upload report
        if: ${{ always() && env.SUITE == 'nightly' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report-${{ github.run_number }}
          path: nightly-report
          if-no-files-found: warn
          retention-days: 30

      # Other suites: e2e's own output (report.json, junit.xml, report.html, traces + screenshots in results/).
      # sessions/ (saved logins) is never uploaded; cache/ is committed in the repo.
      - name: Upload e2e output
        if: ${{ !cancelled() && env.SUITE != 'nightly' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ env.SUITE }}-${{ github.run_number }}
          path: |
            .e2e
            !.e2e/**/sessions/**
            !.e2e/cache/**
          include-hidden-files: true # .e2e is a dot-folder
          if-no-files-found: warn
          retention-days: 7

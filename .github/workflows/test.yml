# `npm test` on every push and pull request: typecheck + verify (tags, brief coverage, charters, npm scripts).
# The app is not opened, no model call, no secret — only two repo variables, which are read while tests are collected.

name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_TELEMETRY_DISABLED: '1'
      APP_URL: ${{ vars.APP_URL }}
      MAILOSAUR_SERVER_ID: ${{ vars.MAILOSAUR_SERVER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

# AI QA for the Motadata console — Azure DevOps. The whole pipeline every night, and any suite by hand (docs/testing.md).
#
# Setup (once):
#   1. Pipelines → Library → create the variable group "nightly-qa":
#        APP_URL (required), APP_NAME
#        Model : AZURE_API_KEY 🔒, AZURE_RESOURCE_NAME, AZURE_OPENAI_DEPLOYMENT
#                (or ANTHROPIC_API_KEY 🔒 / OPENAI_API_KEY 🔒)
#        Login : APP_ADMIN_EMAIL, MAILOSAUR_SERVER_ID, MAILOSAUR_API_KEY 🔒 (all three required: the console admin's sign-in code —
#                without them the admin setup fails, run red)
#        Staging basic auth: BASIC_AUTH_USERNAME, BASIC_AUTH_PASSWORD 🔒   (optional)
#        Notify: TEAMS_WEBHOOK_URL 🔒 / SLACK_WEBHOOK_URL 🔒               (optional)
#   2. On the first run, "Permit" the variable group for the pipeline.
#   3. If "Limit job authorization scope" is ON in Project settings → Pipelines → Settings
#      and the history download fails, give the pipeline's build service Read access to this pipeline.

trigger: none
pr: none

schedules:
  - cron: '17 20 * * *' # daily 20:17 UTC = 1:47 AM IST
    displayName: Nightly QA
    branches:
      include: [main]
    always: true # run even when the code has not changed — the app is deployed every day

# A scheduled run uses the defaults: suite nightly, all modules.
parameters:
  - name: suite
    displayName: 'What to run (nightly = the whole pipeline)'
    type: string
    default: nightly
    # RUNNABLE from lib/suites.ts, without `retest`: it needs the previous run's report.json
    # on the same machine (a new agent has none) — in CI, re-run the failed job.
    values: [nightly, smoke, sanity, regression, bugs, explore, monkey]
  - name: module
    displayName: 'Module, such as iam (empty = all). nightly always runs all modules.'
    type: string
    default: ' '
  - name: appUrl
    displayName: 'To run against another URL (empty = APP_URL from the variable group)'
    type: string
    default: ' '

variables:
  - group: nightly-qa
  # Azure does not set CI=true itself — needed for e2e's CI defaults (read-only cache, test.only blocked)
  - name: CI
    value: 'true'
  - name: E2E_TELEMETRY_DISABLED
    value: '1'
  - name: npm_config_cache
    value: $(Pipeline.Workspace)/.npm
  - name: PLAYWRIGHT_BROWSERS_PATH
    value: $(Pipeline.Workspace)/ms-playwright

pool:
  vmImage: ubuntu-latest

jobs:
  - job: qa
    displayName: QA — ${{ parameters.suite }}
    # The nightly's stages have their own time limits (nightly.config.ts: smoke 10 + regression 45 + 6 charters × 8 = 103 min);
    # the job timeout is above their sum + install — if CI kills the job, no report is written.
    timeoutInMinutes: 130
    steps:
      - checkout: self
        fetchDepth: 1

      - task: NodeTool@0
        displayName: Use Node 24
        inputs:
          versionSpec: '24.x'

      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npm_config_cache)

      - script: npm ci
        displayName: npm ci

      # Typecheck + verify (tags, brief coverage, charters): the app is not opened, no model call, no secret
      # (only APP_URL and MAILOSAUR_SERVER_ID, which are read while tests are collected).
      # Catch a wrong tag or charter here, not in the middle of the night's run.
      - script: npm test
        displayName: npm test
        env:
          APP_URL: ${{ coalesce(trim(parameters.appUrl), '$(APP_URL)') }}
          MAILOSAUR_SERVER_ID: $(MAILOSAUR_SERVER_ID)

      - task: Cache@2
        displayName: Cache Playwright browsers
        inputs:
          key: 'playwright | "$(Agent.OS)" | package-lock.json'
          path: $(PLAYWRIGHT_BROWSERS_PATH)

      - script: npx e2e-web install chromium --with-deps
        displayName: Install browsers

      - ${{ if eq(parameters.suite, 'nightly') }}:
          # Only nightly runs have history. The tag lets the next night find "the previous nightly run",
          # not a smoke/sanity run started by hand in between.
          - script: echo "##vso[build.addbuildtag]nightly"
            displayName: Tag run as nightly

          # history.json of the previous nightly run, for the trend (not found on the first night — that is fine)
          - task: DownloadPipelineArtifact@2
            displayName: Restore history
            continueOnError: true
            inputs:
              source: specific
              project: $(System.TeamProjectId)
              pipeline: $(System.DefinitionId)
              runVersion: latest
              tags: nightly
              allowFailedBuilds: true
              allowPartiallySucceededBuilds: true
              artifact: nightly-history
              path: $(Build.SourcesDirectory)/.nightly-history

      # SUITE / MODULE come from env (parameters are not put straight into the script). MODULE unquoted:
      # empty = all modules, "iam tickets" = two.
      - script: |
          if [ "$SUITE" = nightly ]; then
            node scripts/nightly.ts
          else
            node scripts/suite.ts "$SUITE" $MODULE
          fi
        displayName: Run ${{ parameters.suite }}
        env:
          SUITE: ${{ parameters.suite }}
          MODULE: ${{ parameters.module }}
          # Secret variables do not reach env by themselves — they have to be mapped here.
          # One that is not in the variable group stays the literal "$(NAME)"; the config ignores it.
          APP_URL: ${{ coalesce(trim(parameters.appUrl), '$(APP_URL)') }}
          APP_NAME: $(APP_NAME)
          AZURE_API_KEY: $(AZURE_API_KEY)
          AZURE_RESOURCE_NAME: $(AZURE_RESOURCE_NAME)
          AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
          ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
          OPENAI_API_KEY: $(OPENAI_API_KEY)
          APP_ADMIN_EMAIL: $(APP_ADMIN_EMAIL)
          APP_ADMIN_NAME: $(APP_ADMIN_NAME)
          MAILOSAUR_API_KEY: $(MAILOSAUR_API_KEY)
          # Optional (README → IAM): when not set only those tests are skipped
          IAM_SCIM_USER_EMAIL: $(IAM_SCIM_USER_EMAIL)
          IAM_TEAM: $(IAM_TEAM)
          IAM_TEAM_MEMBER_EMAIL: $(IAM_TEAM_MEMBER_EMAIL)
          MAILOSAUR_SERVER_ID: $(MAILOSAUR_SERVER_ID)
          BASIC_AUTH_USERNAME: $(BASIC_AUTH_USERNAME)
          BASIC_AUTH_PASSWORD: $(BASIC_AUTH_PASSWORD)
          TEAMS_WEBHOOK_URL: $(TEAMS_WEBHOOK_URL)
          SLACK_WEBHOOK_URL: $(SLACK_WEBHOOK_URL)
          NOTIFY_ON: always # or: problems

      # Pass/fail in the Tests tab: every junit.xml this run wrote (in the nightly, both smoke and regression)
      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: .e2e/**/junit.xml
          testRunTitle: nightly-qa ${{ parameters.suite }}
          failTaskOnMissingResultsFile: false

      - ${{ if eq(parameters.suite, 'nightly') }}:
          # always(): upload the report even when the run is red
          - task: PublishPipelineArtifact@1
            displayName: Upload history
            condition: always()
            inputs:
              targetPath: .nightly-history
              artifact: nightly-history

          # Artifacts → download nightly-report → open index.html
          - task: PublishPipelineArtifact@1
            displayName: Upload report
            condition: always()
            inputs:
              targetPath: nightly-report
              artifact: nightly-report

      - ${{ else }}:
          # Other suites: e2e's own output (report.json, junit.xml, report.html, traces + screenshots in results/).
          # sessions/ (saved logins) is never uploaded; cache/ is committed in the repo.
          - task: CopyFiles@2
            displayName: Collect e2e output
            condition: succeededOrFailed()
            inputs:
              SourceFolder: .e2e
              Contents: |
                **
                !**/sessions/**
                !cache/**
              TargetFolder: $(Build.ArtifactStagingDirectory)/e2e

          - task: PublishPipelineArtifact@1
            displayName: Upload e2e output
            condition: succeededOrFailed()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/e2e
              artifact: e2e-${{ parameters.suite }}
